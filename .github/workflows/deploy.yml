name: Deploy to GitHub Pages

# Every push to master rebuilds the site and publishes it straight to GitHub Pages.
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions".
# (Pushing to a gh-pages branch with the built-in token does not start a Pages build, so the
# live site never updated. Deploying the build directly avoids that.)
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # Same as local development (Node 24, npm 11): the lock file is written by npm 11
          node-version: 24
          cache: npm

      # npm install rather than npm ci: the lock file is made on Windows, where npm leaves out
      # packages that only Linux needs (@emnapi/core, @emnapi/runtime), so npm ci rejects it here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
